<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>内容运营中台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    .container {
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      font-weight: bold;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ffffff;
    }
    #status {
      font-size: 14px;
      color: #a0aec0;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto;
      border: 3px solid rgba(102, 126, 234, 0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">运</div>
    <h1>内容运营中台</h1>
    <p id="status">正在初始化运行环境...</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
