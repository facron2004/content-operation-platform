name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 代码质量检查 ────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

  # ── 类型检查 ────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build -w @content/shared

      - name: Check API types
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Check Web types
        run: npx vue-tsc --noEmit -p apps/web/tsconfig.json

  # ── 单元测试 ────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: rm -f prisma/dev.db && npx prisma db push --schema prisma/schema.prisma
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Verify database
        run: |
          ls -la prisma/dev.db
          echo "Checking for AppUser table..."
          sqlite3 prisma/dev.db ".tables" | tr ' ' '\n' | grep AppUser || echo "AppUser NOT FOUND"

      - name: Run tests
        run: npm run test -w @content/api

  # ── 构建验证 ────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Verify build output
        run: |
          test -f apps/api/dist/main.js
          test -f apps/web/dist/index.html
          echo "Build output verified."
