name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 代码质量检查 ────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

  # ── 类型检查 ────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build -w @content/shared

      - name: Check API types
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Check API test types
        run: npx tsc --noEmit -p apps/api/tsconfig.spec.json

      - name: Check Web types
        run: npx vue-tsc --noEmit -p apps/web/tsconfig.json

  # ── Schema 校验 ─────────────────────────────────
  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check migration history and schema drift
        run: |
          mkdir -p .tmp
          touch .tmp/ci-migrations.db
          DATABASE_URL="file:${GITHUB_WORKSPACE}/.tmp/ci-migrations.db" npm run db:migrate
          DATABASE_URL="file:${GITHUB_WORKSPACE}/.tmp/ci-migrations.db" npm run db:drift-check
          DATABASE_URL="file:${GITHUB_WORKSPACE}/.tmp/ci-migrations.db" npm run db:history-report
          npm run test:migration-history
          npm run test:migration-history-report
          npm run test:migration-policy

  # ── API 单元测试 ────────────────────────────────
  api-unit:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API unit tests with coverage
        run: npm run test:unit -w @content/api -- --coverage --coverage.reportsDirectory=coverage/api-unit

      - name: Upload API unit coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api-unit
          path: apps/api/coverage/api-unit/

  # ── 源码 pin 兼容套件 ────────────────────────────
  api-legacy:
    name: API Legacy Pin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API legacy pin tests
        run: npm run test:legacy -w @content/api

  # ── API HTTP 集成测试 ───────────────────────────
  api-integration:
    name: API Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API integration tests with coverage
        run: npm run test:integration -w @content/api -- --coverage --coverage.reportsDirectory=coverage/api-integration

      - name: Upload API integration coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api-integration
          path: apps/api/coverage/api-integration/

  # ── Web 行为测试 ────────────────────────────────
  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Web behavior tests with coverage
        run: npm run test:behavior -w @content/web -- --coverage --coverage.reportsDirectory=coverage/web

      - name: Upload Web coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web
          path: apps/web/coverage/web/

  # ── Web legacy pin 兼容套件 ──────────────────────
  web-legacy:
    name: Web Legacy Pin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Web legacy pin tests
        run: npm run test:legacy -w @content/web

  # ── 测试治理基线 ─────────────────────────────────
  test-governance:
    name: Test Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check legacy pin baseline and suite routing
        run: |
          npm run test:governance
          node --test scripts/test-governance-budget.test.js

  # ── 发布契约与源码完整性 ────────────────────────
  release-contracts:
    name: Release Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check source integrity
        run: npm run check:integrity

      - name: Check package, manifest, and rollback contracts
        run: node --test scripts/desktop-source-contract.test.js scripts/package-security.test.js scripts/package-review.test.js scripts/release-manifest.test.js scripts/release-ops-docs.test.js

      - name: Build and scan review package
        run: npm run package:review -- --output=.tmp/ci-review-package

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: content-ops-source-review
          path: .tmp/ci-review-package
          retention-days: 3

      - name: Check SQLite backup contract
        run: npm run test:db-backup

  # ── 桌面 SQLite 行为测试 ────────────────────────
  desktop-database:
    name: Desktop Database Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop database behavior tests
        run: npm run test:desktop-db

      - name: Run desktop runtime security tests
        run: npm run test:desktop-runtime

      - name: Build formal desktop source
        run: npm run build:desktop

  # ── 构建验证 ────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        schema,
        api-unit,
        api-legacy,
        api-integration,
        web-test,
        web-legacy,
        test-governance,
        release-contracts,
        desktop-database
      ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Verify build output
        run: |
          test -f apps/api/dist/main.js
          test -f apps/web/dist/index.html
          echo "Build output verified."
